baseURL = "https://beltschew.de/"
canonifyURLs = false
relativeURLs = false

enableRobotsTXT = false  # manuell gepflegte robots.txt behalten

themesDir = "themes"
theme = "hugo-serif-theme"

languageCode = "de-de"
defaultContentLanguage = "de"

# automatisch angehängte Branding-Teil - nicht zu lang wählen
title = "Dr. Beltschew"

# beide Standart-Taxonomien verbieten
disableKinds = ["taxonomy", "term"]

[sitemap]
  changefreq = "weekly"
  priority = 0.7
  filename = "sitemap.xml"


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"

[params]
  description = "Systemische Prozessberatung und Konfliktklärung für Organisationen, KMU und Führungskräfte in Dresden. Zertifizierter Mediator und systemischer Berater."
  author = "Dr. Swetoslaw Beltschew"
	
  # In most cases you will only want to set the google_analytics_id OR the google_tag_manager_id. If you have Google Analytics included in your GTM tags don't put your GA ID here. Otherwise your data might be useless.
  #google_analytics_id = "G-N7Q4WNYD8S"
  google_tag_manager_id = "GTM-M3H7VWVB"
  favicon = "favicon-32x32.png"

  [params.homepage]
    sticky_header = true
    show_contact_box = true      # show / hide the contaxt box on the homepage
    show_services_button = true # show / hide the "view all services" button

  [params.logo]
    mobile = "images/logo/Sweti_Mediator_Logo_100x100.png"
    mobile_height = "36px"
    desktop = "images/logo/Sweti_Mediator_Logo_400x400.png"
    desktop_height = "80px"
    alt = "Serif - A Hugo Business Theme"

  [params.fonts]
    # sets the google font link in layouts/partials/google-fonts.html
    google_fonts = 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Source+Sans+Pro:wght@400;700&display=swap'
    heading = "Playfair Display"
    base = "Source Sans Pro"

  [params.colors]
    primary = "#4A9D9F"        # Hauptakzentfarbe (türkisgrün)
#    primary = "#9FBFE9"        
#    black = "#2A3C3C"          # Dunkelgrau-Petrol (Textfarbe)
    black = "#1A1A1A"          
    white = "#FFFFFF"          # Standardweiß (Hintergrund)
#    white = "#E6E3DF"          
    white_offset = "#F5F8F7"   # Leicht grünstichiger Hintergrund (Sektionen)
    grey = "#70817E"           # Graugrün für Icons/Abgrenzungen

  [params.seo]
    meta_twitter_site = "@sweti"
    meta_twitter_creator = "@sweti"
    meta_og_image = "https://beltschew.de/images/screenshot-beltschew-de.png"

  [params.services]
    summary_truncate = 120 # How many characters to include in the summary of the services before truncating

  [params.team]
    summary_large_truncate = 120 # How many characters to include in the summary of the team bios (large layout) before truncating

  [params.footer]
    copyright_text = 'Besuchen sie mein Mediationsblog <a class="zerostatic" href="https://mediator.sweti.de">mediator.sweti.de</a>'

[menu]
  # Main Menu
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 100

  [[menu.main]]
    name = "Meine Kunden"
    url = "/zielgruppen/"
    weight = 200
  
  [[menu.main]]
    name = "Für Rechtsanwälte"
    url = "/services/fuer-rechtsanwaelte/"
    weight = 300
	
  [[menu.main]]
    name = "Für Privatkunden"
    url = "https://mediator.sweti.de/"
    weight = 300

  [[menu.main]]
    name = "Über mich"
    url = "/about/"
    weight = 400

  [[menu.main]]
    name = "Kontakt"
    url = "/contact/"
    weight = 500

  # Footer Menu
  [[menu.footer]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.footer]]
    name = "Kontakt"
    url = "/contact/"
    weight = 2

 [[menu.footer]]
    name = "Datenschutz"
    url = "/datenschutz/"
    weight = 3
	
 [[menu.footer]]
    name = "Impressum"
    url = "/impressum/"
    weight = 4